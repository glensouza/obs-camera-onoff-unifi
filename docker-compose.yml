services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: unifi-camera-azurite
    restart: unless-stopped
    ports:
      - "10000:10000"  # Blob service
      - "10001:10001"  # Queue service
      - "10002:10002"  # Table service
    volumes:
      - azurite-data:/data
    command: "azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --location /data --debug /data/debug.log"
    networks:
      - unifi-network

  app:
    build:
      context: ./OBSCameraPowerControl
      dockerfile: Dockerfile
    container_name: unifi-camera-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      # NOTE: This Azurite connection string uses the well-known development account key
      # and is intended for local development only. When deploying to production, replace
      # this value with an actual Azure Storage connection string provided via environment
      # variables or secrets.
      - AzureStorage=DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1;
      - UniFi__Host=${UNIFI_HOST:-https://192.168.1.1:8443}
      - UniFi__Username=${UNIFI_USERNAME:-admin}
      - UniFi__Password=${UNIFI_PASSWORD}
      - UniFi__SiteName=${UNIFI_SITE:-default}
      - UniFi__SwitchMac=${UNIFI_SWITCH_MAC}
      - UniFi__IgnoreSslErrors=${UNIFI_IGNORE_SSL:-true}
    depends_on:
      - azurite
    networks:
      - unifi-network

volumes:
  azurite-data:
    driver: local

networks:
  unifi-network:
    driver: bridge
